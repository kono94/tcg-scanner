name: Deploy scanner
# A pushed tag checks the web app, then asks the VPS to build and publish that tag
# (deploy/deploy-trigger -> deploy/server-deploy.sh). The model bundle and thumbnails must already
# be in the VPS DVC store: run deploy/push-artifacts.sh before tagging.
on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Bundle parity tests skip without the DVC bundle; they are not verified here.
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    concurrency: deploy-scanner
    steps:
      - uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          port: 2222
          username: github-deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: "trigger-deploy ${{ github.ref_name }}" # the key's command= runs deploy-trigger scanner
