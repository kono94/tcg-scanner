experiment:
  name: mobilenetv3_onepiece_classifier
  seed: 42
  output_dir: runs/card_recognizer/experiments

dataset:
  cards_dir: datasets/card_recognizer/cards
  manual_eval_dir: datasets/card_recognizer/manual_eval
  eval_required: true

model:
  feature_dim: 256
  pretrained: true
  freeze_backbone_epochs: 0

data:
  batch_size: 32
  num_workers: 0
  pin_memory: true

augmentation:
  resize: 256
  crop_size: 224
  random_resized_crop_scale: [0.9, 1.0]
  color_jitter:
    brightness: 0.35
    contrast: 0.35
    saturation: 0.2
    hue: 0.03
  random_affine:
    degrees: 5
    translate: [0.04, 0.04]
    scale: [0.97, 1.04]
  random_perspective:
    distortion_scale: 0.12
    p: 0.3
  random_erasing:
    p: 0.25
    scale: [0.01, 0.06]

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001
  backbone_lr_multiplier: 0.1

scheduler:
  name: cosine
  min_lr: 0.000001

trainer:
  max_epochs: 20
  accelerator: auto
  devices: auto
  precision: 32-true
  deterministic: true
  log_every_n_steps: 10
  check_val_every_n_epoch: 1

tracking:
  csv: true
  tensorboard: false

evaluation:
  app_target_precision: 0.95
  app_min_coverage: 0.5
  softmax_thresholds: [0.0, 0.01, 0.02, 0.03, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5, 0.7, 0.85, 0.95]
  margin_thresholds: [0.0, 0.005, 0.01, 0.02, 0.03, 0.05, 0.1, 0.2]
