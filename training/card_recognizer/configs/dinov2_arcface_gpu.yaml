# GPU run (RTX 4070 Super): larger batches, more steps and classes, 4 trainable blocks.
# Same data isolation as the pilot: held-out identities/families never enter gradients;
# checkpoint selection on validation; test evaluated once after selection.
seed: 42
device: cuda
cpu_threads: 8
dataset_root: datasets/curated
transformers_runtime: runs/foundation_teacher/runtime
pretrained_model_path: runs/card_recognizer/dinov2_baseline/hf_cache/hub/models--facebook--dinov2-small/snapshots/ed25f3a31f01632728cabb09d1542f84ab7b0056
pretrained_weights_sha256: ae1e99fcefd534ed978cdeb8326f08030c96e28b7a81ffcbc98a857c84d14be1
embedding_dimension: 384
max_training_classes: 6000
# Root review found this same-art printing pair unresolved in real captures.
excluded_training_identities:
  - onepiece:en:OP09-014
  - onepiece:en:OP09-014_p1
trainable_last_blocks: 4
head_warmup_epochs: 1
epochs: 14
steps_per_epoch: 150
identities_per_batch: 32
evaluation_batch_size: 128
margin_radians: 0.2
logit_scale: 16.0
backbone_lr: 0.00003
projection_lr: 0.0001
proxy_lr: 0.001
weight_decay: 0.0001
log_every_steps: 25
final_full_catalog_evaluation: true
