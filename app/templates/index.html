<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Card Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.5/dist/htmx.min.js"></script>

    <style>
        .fade-in {
            animation: fadeIn 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-anim {
            animation: popIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.7) rotate(-5deg);
                opacity: 0;
            }

            80% {
                transform: scale(1.05) rotate(2deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-100 via-pink-100 to-yellow-100 min-h-screen flex flex-col items-center">
    <div class="w-full max-w-2xl mt-8 p-6 bg-white/80 rounded-lg shadow-2xl backdrop-blur-md fade-in">
        <h1
            class="text-4xl font-extrabold mb-4 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-pink-500 to-yellow-500 animate-pulse">
            TCG Card Scanner</h1>
        <div id="camera-section" class="flex flex-col items-center relative">
            <div class="relative w-[400px] h-[300px] flex items-center justify-center">
                <video id="video"
                    class="rounded-lg border shadow-lg absolute top-0 left-0 w-full h-full object-cover transition-all duration-300"
                    width="400" height="300" autoplay muted playsinline></video>
                <canvas id="canvas"
                    class="rounded-lg border shadow-lg absolute top-0 left-0 w-full h-full object-cover hidden transition-all duration-300"></canvas>
            </div>
            <form id="upload-form" class="flex gap-2 mt-2">
                <input type="file" id="file-input" name="file" accept="image/*" capture="environment" class="hidden" />
                <button type="button" id="take-photo"
                    class="px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700 transition-all duration-200 cursor-pointer">Take
                    Photo</button>
                <button type="button" id="retake-photo"
                    class="px-4 py-2 bg-gray-400 text-white rounded shadow hover:bg-gray-500 hidden transition-all duration-200 cursor-pointer">Retake</button>
                <button type="submit" id="upload-photo"
                    class="px-4 py-2 bg-green-600 text-white rounded shadow hover:bg-green-700 hidden transition-all duration-200 cursor-pointer">Upload</button>
            </form>
        </div>
        <div id="upload-status" class="mt-4"></div>
    </div>
    <div class="w-full max-w-2xl mt-6">
        <h2 class="text-2xl font-bold mb-2 text-center text-blue-700 drop-shadow">Recognized Cards</h2>
        <div id="bundles-list" class="flex flex-col gap-6"></div>
    </div>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const takePhotoBtn = document.getElementById('take-photo');
        const retakePhotoBtn = document.getElementById('retake-photo');
        const uploadPhotoBtn = document.getElementById('upload-photo');
        const fileInput = document.getElementById('file-input');
        const uploadForm = document.getElementById('upload-form');
        let stream;
        let photoTaken = false;

        async function startCamera() {
            if (!stream) {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });
                video.srcObject = stream;
            }
            video.classList.remove('hidden');
        }

        function showCanvas() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.classList.remove('hidden');
            video.classList.add('opacity-30');
        }

        function hideCanvas() {
            canvas.classList.add('hidden');
            video.classList.remove('opacity-30');
        }

        takePhotoBtn.onclick = function () {
            showCanvas();
            takePhotoBtn.classList.add('hidden');
            retakePhotoBtn.classList.remove('hidden');
            uploadPhotoBtn.classList.remove('hidden');
            canvas.toBlob(blob => {
                const file = new File([blob], 'photo.jpg', {
                    type: 'image/jpeg'
                });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                fileInput.files = dataTransfer.files;
                photoTaken = true;
                uploadPhotoBtn.disabled = false;
            });
        };

        retakePhotoBtn.onclick = function () {
            hideCanvas();
            takePhotoBtn.classList.remove('hidden');
            retakePhotoBtn.classList.add('hidden');
            uploadPhotoBtn.classList.add('hidden');
            fileInput.value = '';
            photoTaken = false;
            uploadPhotoBtn.disabled = true;
        };

        function resetAfterUpload() {
            hideCanvas();
            takePhotoBtn.classList.remove('hidden');
            retakePhotoBtn.classList.add('hidden');
            uploadPhotoBtn.classList.add('hidden');
            fileInput.value = '';
            photoTaken = false;
            uploadPhotoBtn.disabled = true;
        }
        uploadPhotoBtn.onclick = async function (e) {
            e.preventDefault(); // Prevent any default form submission

            if (!photoTaken || !fileInput.files.length || !fileInput.files[0].type.startsWith('image/')) {
                console.error('No valid image file selected for upload');
                resetAfterUpload();
                return;
            }

            const formData = new FormData(uploadForm);
            if (formData.get("file").size < 400) {
                console.error('Image file is too small. Please take a photo or select a valid image file.');
                resetAfterUpload();
                return;
            }
            for (let [key, value] of formData.entries()) {
                console.debug('FormData:', key, value);
            }
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(JSON.stringify(err));
                }

                const html = await response.text();
                document.querySelector('#bundles-list').insertAdjacentHTML('afterbegin', html);
                resetAfterUpload();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to upload image. Please try again.');
            }
        };


        startCamera();
    </script>
</body>

</html>
