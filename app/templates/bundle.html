<div class="flex flex-col md:flex-row gap-4 bg-white rounded-lg shadow-2xl p-4 fade-in">
    <div class="flex-shrink-0 flex flex-col items-center justify-center">
        <img src="{{ input_image_url }}" alt="Input" class="w-[400px] h-[300px] object-cover rounded border shadow-lg transition-all duration-300 hover:scale-105 hover:shadow-2xl" />
    </div>
    <div class="flex-1">
        <div class="font-semibold mb-2 text-lg">Detected Cards:</div>
        <div class="grid grid-cols-1 gap-2">
            {% if cards %}
                {% for card in cards %}
                    <div class="flex items-center gap-3 border-b pb-2 last:border-b-0 card-anim bg-gradient-to-r from-blue-50 via-pink-50 to-yellow-50 rounded-lg p-2 shadow hover:scale-105 transition-transform duration-200">
                        <img src="{{ card.image_url or '/static/placeholder.jpg' }}" alt="{{ card.name }}" class="w-16 h-24 object-cover rounded shadow" />
                        <div>
                            <div class="font-bold text-lg">{{ card.name }}</div>
                            <div class="text-sm text-gray-600">ID: {{ card.card_id }}</div>
                            <div class="font-semibold mt-1 {{ card.price_color }}">${{ '%.2f'|format(card.price) }}</div>
                            <div class="text-xs mt-1 {{ card.confidence_color }}">Confidence: {{ '%.1f'|format(card.confidence * 100) }}%</div>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="text-gray-500">No cards detected.</div>
            {% endif %}
        </div>
    </div>
</div>
